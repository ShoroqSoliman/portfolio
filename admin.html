<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Shorouk Soliman</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="adm"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>
<script src="data.js"></script>
<script>
let D,cur='pro',T;
const pw=()=>localStorage.getItem('pw')||'shorouk123';
const SCH={
 text:[['text','Text','bia']],
 card:[['title','Title','bi'],['sub','Subtitle','bi'],['date','Date','pl'],['text','Description','bia']],
 tags:[['text','Tags, separated by commas','bi']],
 media:[['src','Image or video','file']],
 logo:[['name','Company name','pl'],['src','Logo image','file']]
};
const NAMES={text:'Text',card:'Card',tags:'Tags',media:'Image / Video',logo:'Company logo'};
function h(tag,a={},...k){const n=document.createElement(tag);Object.assign(n,a);k.flat().forEach(x=>x!=null&&n.append(x));return n}
const st=()=>document.getElementById('st');
let timer;
function save(){const s=st();if(s)s.textContent='…';clearTimeout(timer);timer=setTimeout(async()=>{await DB.set(D);if(st())st().textContent='Saved ✓'},300)}
const rd=f=>new Promise(r=>{
 if(f.type.startsWith('video')){
  if(f.size>15e6){alert('This video is over 15 MB. Upload it to YouTube or Drive and paste the link instead.');return r('')}
  const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f);return}
 const i=new Image;i.onload=()=>{const s=Math.min(1,1400/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL(f.type=='image/png'?'image/png':'image/jpeg',.82))};i.src=URL.createObjectURL(f)});
function F(o,k,label,ty){
 const w=h('div',{},h('label',{textContent:label}));
 if(ty=='bi'||ty=='bia'){
  o[k]=(o[k]&&typeof o[k]=='object')?o[k]:{en:o[k]||'',ar:''};
  ['en','ar'].forEach(l=>w.append(h(ty=='bia'?'textarea':'input',{value:o[k][l]||'',placeholder:l=='en'?'English':'عربي',rows:3,dir:l=='ar'?'rtl':'ltr',oninput:e=>{o[k][l]=e.target.value;save()}})));
 }else if(ty=='file'){
  if(o[k])w.append(o.type=='video'||/youtu|\.mp4|^data:video/.test(o[k])?h('small',{textContent:'Video attached'}):h('img',{src:o[k],className:'pv'}));
  w.append(h('input',{type:'file',accept:'image/*,video/*',onchange:async e=>{const f=e.target.files[0];if(!f)return;const v=await rd(f);if(!v)return;o[k]=v;o.type=f.type.startsWith('video')?'video':'image';save();R()}}),
   h('input',{value:o[k]&&!o[k].startsWith('data:')?o[k]:'',placeholder:'…or paste a link (YouTube or image URL)',oninput:e=>{o[k]=e.target.value;o.type=/youtu|\.mp4/.test(o[k])?'video':'image';save()}}));
 }else w.append(h('input',{value:o[k]||'',dir:/mail|phone|linkedin|date/.test(k)?'ltr':'auto',oninput:e=>{o[k]=e.target.value;save()}}));
 return w;
}
const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();R()};
const btn=(txt,fn,cls='mini')=>h('button',{className:cls,textContent:txt,onclick:fn,type:'button'});
function R(){
 const side=document.getElementById('side'),main=document.getElementById('main');side.innerHTML='';main.innerHTML='';
 const sx=D.sections;
 side.append(h('h3',{textContent:'Admin'}),h('div',{className:'st',id:'st'}),
  h('div',{className:'si'+(cur=='pro'?' on':''),onclick:()=>{cur='pro';R()}},h('span',{textContent:'Profile & contact'})),
  h('div',{className:'hint',textContent:'Sections',style:'margin:14px 0 4px'}),
  ...sx.map((s,i)=>h('div',{className:'si'+(cur==s.id?' on':'')},
   h('span',{textContent:(s.title.en||s.title.ar||'Untitled')+(s.visible===false?' (hidden)':''),onclick:()=>{cur=s.id;R()}}),
   btn('↑',()=>mv(sx,i,-1)),btn('↓',()=>mv(sx,i,1)))),
  btn('+ Add section',()=>{const id='s'+Date.now();sx.push({id,visible:true,title:{en:'New section',ar:'قسم جديد'},blocks:[]});cur=id;save();R()},'btn'),
  h('hr',{style:'border:0;border-top:1px solid var(--ln);margin:18px 0'}),
  h('a',{className:'mini',href:'index.html?preview',target:'_blank',textContent:'Preview site',style:'display:block;text-align:center;margin-bottom:8px'}),
  btn('Export content.json',()=>{const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'})),download:'content.json'});a.click()}),
  h('label',{className:'mini',style:'display:block;margin-top:8px;text-align:center',textContent:'Import content.json'},
   h('input',{type:'file',accept:'.json',style:'display:none',onchange:async e=>{try{D=JSON.parse(await e.target.files[0].text());await DB.set(D);cur='pro';R()}catch(x){alert('Invalid file')}}})),
  btn('Reset to default',()=>{if(confirm('Delete all your edits in this browser?')){indexedDB.deleteDatabase('sh-portfolio');location.reload()}}));
 if(cur=='pro'){
  const p=D.profile;
  main.append(h('h2',{textContent:'Profile & contact'}),h('div',{className:'hint',textContent:'Your name, photo and contact details. Change them anytime.'}),
   h('div',{className:'box'},F(p,'name','Name','bi'),F(p,'title','Job title','bi'),F(p,'bio','Short bio','bia'),F(p,'photo','Photo','file')),
   h('div',{className:'box'},F(p,'email','Email','pl'),F(p,'phone','Phone','pl'),F(p,'linkedin','LinkedIn URL','pl')),
   h('div',{className:'box'},h('label',{textContent:'Hero stats'}),(p.stats=p.stats||[]).map((x,i)=>h('div',{className:'row'},F(x,'n','Number','pl'),F(x,'l','Label','bi'),btn('✕',()=>{p.stats.splice(i,1);save();R()}))),
    btn('+ Add stat',()=>{p.stats.push({n:'',l:{en:'',ar:''}});R()})),
   h('div',{className:'box'},h('label',{textContent:'Admin password (kept in this browser only)'}),h('input',{type:'password',placeholder:'New password',onchange:e=>{if(e.target.value){localStorage.setItem('pw',e.target.value);alert('Password updated')}}})));
  return;
 }
 const i=sx.findIndex(s=>s.id==cur),s=sx[i];if(!s){cur='pro';return R()}
 main.append(h('div',{className:'row'},h('h2',{textContent:'Section'}),
  btn(s.visible===false?'Show on site':'Hide from site',()=>{s.visible=s.visible===false;save();R()}),
  btn('Delete section',()=>{if(confirm('Delete this section and everything in it?')){sx.splice(i,1);cur='pro';save();R()}})),
  h('div',{className:'box'},F(s,'title','Section title','bi')),
  h('div',{className:'hint',textContent:'A section can hold any mix of blocks. Add as many as you need.'}));
 s.blocks.forEach((b,j)=>main.append(h('div',{className:'box'},
  h('div',{className:'row'},h('b',{textContent:NAMES[b.kind]}),btn('↑',()=>mv(s.blocks,j,-1)),btn('↓',()=>mv(s.blocks,j,1)),btn('✕',()=>{s.blocks.splice(j,1);save();R()})),
  SCH[b.kind].map(f=>F(b,...f)))));
 main.append(h('div',{className:'row'},Object.keys(NAMES).map(k=>btn('+ '+NAMES[k],()=>{s.blocks.push({kind:k});save();R()}))));
}
(async()=>{
 D=await loadData(true);
 if(sessionStorage.getItem('ok')!='1'){const v=prompt('Password');if(v!==pw()){document.body.innerHTML='<p style="padding:40px">Wrong password. Reload to try again.</p>';return}sessionStorage.setItem('ok','1')}
 R();
})();
</script>
</body>
</html>
